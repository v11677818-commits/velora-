<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velora Group</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:white;
}

.chat{
display:flex;
flex-direction:column;
height:100vh;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.msg{
display:flex;
gap:10px;
margin-bottom:15px;
}

.msg img{
width:40px;
height:40px;
border-radius:50%;
}

.msg p{
margin:0;
color:#ccc;
}

.input{
display:flex;
padding:10px;
background:#111;
}

.input input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#222;
color:white;
}

.input button{
margin-left:10px;
padding:12px 20px;
border:none;
border-radius:10px;
background:white;
color:black;
cursor:pointer;
}
</style>
</head>

<body>

<div class="chat">

<div id="messages" class="messages"></div>

<div class="input">
<input id="text" placeholder="Type message...">
<button id="sendBtn">Send</button>
</div>

</div>

<script>

const supabaseClient = supabase.createClient(
"https://lwnheytfhwgryxikjjwu.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bmhleXRmaHdncnl4aWtqand1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MDcxNjEsImV4cCI6MjA5MzI4MzE2MX0.qTJGYWouA9w9RZU8WFkE7ZbK-J3O1Snvwi9CbEMNxtQ"
);

const input = document.getElementById("text");
const btn = document.getElementById("sendBtn");
const box = document.getElementById("messages");

const name = localStorage.getItem("name") || "User";
const avatar = localStorage.getItem("avatar") || "https://i.imgur.com/6VBx3io.png";

// إرسال
async function send(){
const msg = input.value.trim();
if(!msg) return;

const { error } = await supabaseClient.from("messages").insert([
{
name:name,
avatar:avatar,
message:msg
}
]);

if(error){
alert(error.message);
return;
}

input.value="";
}

// زر
btn.onclick = send;

// Enter
input.addEventListener("keydown", function(e){
if(e.key === "Enter") send();
});

// تحميل الرسائل
async function load(){

const { data, error } = await supabaseClient
.from("messages")
.select("*")
.order("created_at",{ascending:true});

if(error){
console.log(error);
return;
}

box.innerHTML = "";

data.forEach(function(m){
box.innerHTML += `
<div class="msg">
<img src="${m.avatar}">
<div>
<b>${m.name}</b>
<p>${m.message}</p>
</div>
</div>
`;
});

box.scrollTop = box.scrollHeight;
}

setInterval(load,1000);
load();

</script>

</body>
</html>
