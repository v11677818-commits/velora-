<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قروب Velora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#000;
color:#fff;
height:100vh;
overflow:hidden;
}

/* الرسائل */

.messages{
position:absolute;
top:20px;
left:0;
width:100%;
height:calc(100vh - 120px);
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:14px;
}

.message{
background:#111;
border:1px solid #222;
padding:14px;
border-radius:18px;
}

.msg-name{
font-size:14px;
color:#999;
margin-bottom:6px;
}

.msg-text{
font-size:16px;
line-height:1.5;
}

/* تحت */

.bottom-bar{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:92%;
height:68px;
background:#151515;
border:1px solid #2a2a2a;
border-radius:40px;
display:flex;
align-items:center;
padding:0 14px;
}

.message-input{
flex:1;
height:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:17px;
padding:0 12px;
}

.send-btn{
width:52px;
height:52px;
border-radius:50%;
border:none;
background:#222;
color:#fff;
font-size:24px;
cursor:pointer;
}

</style>

</head>

<body>

<!-- الرسائل -->

<div class="messages" id="messages"></div>

<!-- الارسال -->

<div class="bottom-bar">

<input
type="text"
id="nameInput"
class="message-input"
placeholder="اسمك"
style="max-width:120px;">

<input
type="text"
id="messageInput"
class="message-input"
placeholder="اكتب رسالتك">

<button
class="send-btn"
onclick="sendMessage()">
+
</button>

</div>

<script>

/* ربط Supabase */

const supabaseUrl =
"https://lwnheytfhwgryxikjjwu.supabase.co";

const supabaseKey =
"حطي المفتاح هنا";

const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

/* ارسال */

async function sendMessage(){

const name =
document
.getElementById("nameInput")
.value
.trim();

const text =
document
.getElementById("messageInput")
.value
.trim();

if(name === "" || text === ""){
return;
}

/* حفظ */

await supabase
.from("messages")
.insert([
{
name:name,
message:text
}
]);

/* تنظيف */

document
.getElementById("messageInput")
.value = "";

loadMessages();

}

/* تحميل الرسائل */

async function loadMessages(){

const { data } =
await supabase
.from("messages")
.select("*")
.order(
"created_at",
{
ascending:true
}
);

const box =
document
.getElementById("messages");

box.innerHTML = "";

data.forEach(msg=>{

box.innerHTML += `

<div class="message">

<div class="msg-name">
${msg.name}
</div>

<div class="msg-text">
${msg.message}
</div>

</div>

`;

});

box.scrollTop =
box.scrollHeight;

}

/* تحديث تلقائي */

loadMessages();

setInterval(
loadMessages,
2000
);

</script>

</body>
</html>
