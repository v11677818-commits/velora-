<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#000;
color:#fff;
height:100vh;
overflow:hidden;
}

/* فوق */

.top-bar{
position:fixed;
top:20px;
right:20px;
display:flex;
gap:12px;
z-index:1000;
}

.subscribe-btn{
background:#151515;
border:1px solid #2a2a2a;
color:#fff;
padding:14px 34px;
border-radius:40px;
font-size:16px;
cursor:pointer;
}

.menu-btn{
width:58px;
height:58px;
border-radius:50%;
border:1px solid #2a2a2a;
background:#151515;
color:#fff;
font-size:28px;
cursor:pointer;
}

/* القائمة */

.sidebar{
position:fixed;
top:0;
right:-100%;
width:85%;
max-width:360px;
height:100%;
background:#000;
padding:30px 22px;
transition:.4s;
z-index:999;
overflow-y:auto;
}

.sidebar.active{
right:0;
}

.search-box{
width:100%;
height:58px;
background:#151515;
border:1px solid #2a2a2a;
border-radius:40px;
padding:0 20px;
color:#fff;
font-size:16px;
outline:none;
margin-bottom:35px;
}

.menu-links{
display:flex;
flex-direction:column;
gap:28px;
}

.menu-links a{
color:#fff;
text-decoration:none;
font-size:20px;
}

/* الخلفية */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,.15);
backdrop-filter:blur(2px);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:500;
}

.overlay.active{
opacity:1;
pointer-events:auto;
}

/* النص */

.center-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:42px;
font-weight:600;
}

/* الرسائل */

.messages{
position:absolute;
top:100px;
left:0;
width:100%;
height:calc(100vh - 190px);
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:16px;
}

.message{
background:#111;
padding:14px;
border-radius:18px;
}

.msg-name{
font-size:14px;
color:#999;
margin-bottom:5px;
}

.msg-text{
font-size:16px;
line-height:1.5;
}

/* تحت */

.bottom-bar{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:92%;
height:68px;
background:#151515;
border:1px solid #2a2a2a;
border-radius:40px;
display:flex;
align-items:center;
padding:0 14px;
z-index:1000;
}

.message-input{
flex:1;
height:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:17px;
padding:0 12px;
}

.send-btn{
width:52px;
height:52px;
border-radius:50%;
border:none;
background:#222;
color:#fff;
font-size:24px;
cursor:pointer;
}

</style>

</head>

<body>

<!-- فوق -->

<div class="top-bar">

<button class="subscribe-btn">
اشتراك
</button>

<button class="menu-btn" onclick="openMenu()">
☰
</button>

</div>

<!-- الخلفية -->

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- القائمة -->

<div class="sidebar" id="sidebar">

<input
class="search-box"
placeholder="بحث">

<div class="menu-links">

<a href="#">قروب</a>

<a href="#">بوت</a>

<a href="#">velora لعبة</a>

<a href="#">تنسيقات ملابس</a>

<a href="#">تحديات اسبوعيه</a>

<a href="#">اشتراك</a>

<a href="#">سوق velora</a>

<a href="#">الملف الشخصي</a>

</div>

</div>

<!-- النص -->

<div class="center-text">
كيف يمكنني المساعدة؟
</div>

<!-- الرسائل -->

<div class="messages" id="messages"></div>

<!-- تحت -->

<div class="bottom-bar">

<input
type="text"
id="messageInput"
class="message-input"
placeholder="اكتب رسالتك">

<button
class="send-btn"
onclick="sendMessage()">
+
</button>

</div>

<script>

/* القائمة */

function openMenu(){

document
.getElementById("sidebar")
.classList
.add("active");

document
.getElementById("overlay")
.classList
.add("active");

}

function closeMenu(){

document
.getElementById("sidebar")
.classList
.remove("active");

document
.getElementById("overlay")
.classList
.remove("active");

}

/* ربط Supabase */

const supabaseUrl =
"https://lwnheytfhwgryxikjjwu.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bmhleXRmaHdncnl4aWtqand1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MDcxNjEsImV4cCI6MjA5MzI4MzE2MX0.qTJGYWouA9w9RZU8WFkE7ZbK-J3O1Snvwi9CbEMNxtQ";

const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

/* ارسال الرسائل */

async function sendMessage(){

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(text === ""){
return;
}

/* اضافة الرسالة بالشاشة */

const messages =
document.getElementById("messages");

messages.innerHTML += `

<div class="message">

<div class="msg-name">
أنت
</div>

<div class="msg-text">
${text}
</div>

</div>

`;

messages.scrollTop =
messages.scrollHeight;

/* تنظيف */

input.value = "";

/* حفظ Supabase */

await supabase
.from("messages")
.insert([
{
name:"أنت",
message:text
}
]);

}

/* تحميل الرسائل */

async function loadMessages(){

const { data } =
await supabase
.from("messages")
.select("*")
.order(
"created_at",
{
ascending:true
}
);

const box =
document.getElementById("messages");

box.innerHTML = "";

data.forEach(msg=>{

box.innerHTML += `

<div class="message">

<div class="msg-name">
${msg.name}
</div>

<div class="msg-text">
${msg.message}
</div>

</div>

`;

});

box.scrollTop =
box.scrollHeight;

}

/* تشغيل */

loadMessages();

setInterval(
loadMessages,
2000
);

</script>

</body>
</html>
