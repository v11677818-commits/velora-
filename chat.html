<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
overflow:hidden;
}

.app{
width:100%;
height:100vh;
background:#000;
position:relative;
overflow:hidden;
}

/* TOP */

.topbar{
position:absolute;
top:22px;
right:22px;
display:flex;
align-items:center;
gap:14px;
z-index:1000;
}

.subscribe-btn{
height:52px;
padding:0 30px;
border:none;
border-radius:999px;
background:#1a1a1a;
color:#fff;
font-size:16px;
cursor:pointer;
}

.menu-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#1a1a1a;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.menu-icon{
width:20px;
height:2px;
background:#fff;
position:relative;
}

.menu-icon::before{
content:'';
position:absolute;
top:-6px;
left:0;
width:20px;
height:2px;
background:#fff;
}

.menu-icon::after{
content:'';
position:absolute;
top:6px;
left:0;
width:20px;
height:2px;
background:#fff;
}

/* CENTER */

.center-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:#fff;
font-size:44px;
font-weight:600;
}

/* INPUT */

.chat-box{
position:absolute;
bottom:22px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:1000px;
height:72px;
background:#161616;
border:1px solid #262626;
border-radius:40px;
display:flex;
align-items:center;
padding:0 14px;
gap:12px;
}

.voice-btn{
width:46px;
height:46px;
border-radius:50%;
background:#fff;
border:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.voice-bars{
display:flex;
align-items:end;
gap:2px;
height:16px;
}

.voice-bars span{
width:3px;
background:#000;
border-radius:999px;
}

.voice-bars span:nth-child(1){
height:7px;
}

.voice-bars span:nth-child(2){
height:13px;
}

.voice-bars span:nth-child(3){
height:10px;
}

.voice-bars span:nth-child(4){
height:16px;
}

.chat-input{
flex:1;
height:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:17px;
padding:0 10px;
}

.chat-input::placeholder{
color:#8a8a8a;
}

.plus-btn{
width:50px;
height:50px;
border-radius:50%;
border:none;
background:#222;
color:#fff;
font-size:28px;
cursor:pointer;
}

/* SIDEBAR */

.overlay{
position:fixed;
inset:0;
background:rgba(255,255,255,.10);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:1500;
}

.overlay.active{
opacity:1;
pointer-events:auto;
}

.sidebar{
position:fixed;
top:0;
right:-420px;
width:420px;
max-width:100%;
height:100vh;
background:#050505;
padding:30px;
transition:.35s;
z-index:2000;
overflow:auto;
}

.sidebar.active{
right:0;
}

.search-box{
width:100%;
height:58px;
background:#171717;
border:1px solid #2a2a2a;
border-radius:40px;
display:flex;
align-items:center;
padding:0 22px;
margin-top:40px;
}

.search-box input{
width:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:16px;
}

.search-box input::placeholder{
color:#888;
}

.sidebar-links{
margin-top:50px;
display:flex;
flex-direction:column;
gap:34px;
}

.sidebar-links button{
background:none;
border:none;
color:#fff;
font-size:34px;
text-align:right;
cursor:pointer;
}

.profile{
position:absolute;
bottom:30px;
right:30px;
display:flex;
align-items:center;
gap:12px;
}

.profile-circle{
width:45px;
height:45px;
border-radius:50%;
background:#8f44fd;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:15px;
}

.profile span{
color:#fff;
font-size:18px;
}

@media(max-width:700px){

.center-text{
font-size:30px;
}

.sidebar{
width:100%;
}

.sidebar-links button{
font-size:26px;
}

}

</style>
</head>

<body>

<div class="app">

<div class="topbar">

<button class="subscribe-btn">
Subscription
</button>

<button class="menu-btn" id="menuButton">
<div class="menu-icon"></div>
</button>

</div>

<div class="center-text">
How can I help you?
</div>

<div class="chat-box">

<button class="voice-btn">

<div class="voice-bars">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</button>

<input
type="text"
class="chat-input"
placeholder="Ask Velora"
/>

<button class="plus-btn">
+
</button>

</div>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">

<div class="search-box">
<input type="text" placeholder="Search">
</div>

<div class="sidebar-links">

<button>Group</button>

<button>Bot</button>

<button>Velora Game</button>

<button>Outfits</button>

<button>Weekly Challenges</button>

<button>Velora Store</button>

<button>Subscription</button>

<button>Profile</button>

<button>Create Group</button>

</div>

<div class="profile">

<div class="profile-circle">
VW
</div>

<span>Profile</span>

</div>

</div>

</div>

<script>

const menuButton = document.getElementById('menuButton');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

menuButton.onclick = () => {

sidebar.classList.add('active');
overlay.classList.add('active');

}

overlay.onclick = () => {

sidebar.classList.remove('active');
overlay.classList.remove('active');

}

</script>

</body>
</html>
