<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Velora</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
overflow:hidden;
}

/* MAIN */

.app{
width:100%;
height:100vh;
background:#000;
position:relative;
overflow:hidden;
}

/* TOP */

.top-bar{
position:absolute;
top:20px;
right:20px;
display:flex;
align-items:center;
gap:14px;
z-index:1000;
}

.subscription-btn{
height:52px;
padding:0 28px;
border:none;
border-radius:999px;
background:#161616;
color:#fff;
font-size:15px;
font-weight:400;
cursor:pointer;
}

.menu-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#161616;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.menu-lines{
width:18px;
height:2px;
background:#fff;
position:relative;
}

.menu-lines::before{
content:'';
position:absolute;
top:-6px;
left:0;
width:18px;
height:2px;
background:#fff;
}

.menu-lines::after{
content:'';
position:absolute;
top:6px;
left:0;
width:18px;
height:2px;
background:#fff;
}

/* CENTER */

.center-title{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:#fff;
font-size:42px;
font-weight:600;
white-space:nowrap;
}

/* CHAT BAR */

.chat-bar{
position:absolute;
bottom:22px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:1020px;
height:72px;
background:#171717;
border:1px solid #262626;
border-radius:40px;
display:flex;
align-items:center;
padding:0 14px;
gap:12px;
}

/* VOICE */

.voice-btn{
width:46px;
height:46px;
border:none;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex-shrink:0;
}

.voice-wave{
display:flex;
align-items:flex-end;
gap:2px;
height:16px;
}

.voice-wave span{
width:3px;
background:#000;
border-radius:999px;
}

.voice-wave span:nth-child(1){
height:6px;
}

.voice-wave span:nth-child(2){
height:11px;
}

.voice-wave span:nth-child(3){
height:16px;
}

.voice-wave span:nth-child(4){
height:9px;
}

/* INPUT */

.chat-input{
flex:1;
height:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:16px;
padding:0 8px;
}

.chat-input::placeholder{
color:#9a9a9a;
}

/* PLUS */

.plus-btn{
width:50px;
height:50px;
border:none;
border-radius:50%;
background:#222;
color:#fff;
font-size:30px;
cursor:pointer;
flex-shrink:0;
}

/* SIDEBAR */

.overlay{
position:fixed;
inset:0;
background:rgba(255,255,255,.08);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:100;
}

.overlay.active{
opacity:1;
pointer-events:auto;
}

.sidebar{
position:fixed;
top:0;
right:-420px;
width:420px;
max-width:100%;
height:100vh;
background:#050505;
padding:26px;
transition:.35s;
z-index:200;
overflow:auto;
}

.sidebar.active{
right:0;
}

/* SEARCH */

.search-box{
width:100%;
height:58px;
background:#171717;
border:1px solid #262626;
border-radius:40px;
display:flex;
align-items:center;
padding:0 20px;
margin-top:60px;
}

.search-box input{
width:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:16px;
}

.search-box input::placeholder{
color:#888;
}

/* MENU LINKS */

.sidebar-links{
display:flex;
flex-direction:column;
gap:34px;
margin-top:50px;
}

.sidebar-links a{
text-decoration:none;
color:#fff;
font-size:34px;
font-weight:400;
text-align:right;
}

/* PROFILE */

.profile{
position:absolute;
bottom:30px;
right:30px;
display:flex;
align-items:center;
gap:12px;
}

.profile-circle{
width:46px;
height:46px;
border-radius:50%;
background:#9147ff;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:14px;
}

.profile-text{
color:#fff;
font-size:18px;
}

/* MOBILE */

@media(max-width:700px){

.center-title{
font-size:30px;
}

.sidebar{
width:100%;
}

.sidebar-links a{
font-size:26px;
}

.chat-bar{
height:68px;
}

}

</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="top-bar">

<a href="subscription.html">
<button class="subscription-btn">
Subscription
</button>
</a>

<button class="menu-btn" id="openMenu">
<div class="menu-lines"></div>
</button>

</div>

<!-- CENTER -->

<div class="center-title">
How can I help you?
</div>

<!-- CHAT -->

<div class="chat-bar">

<button class="voice-btn">

<div class="voice-wave">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</button>

<input
type="text"
class="chat-input"
placeholder="Ask Velora"
/>

<button class="plus-btn">
+
</button>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<div class="search-box">

<input
type="text"
placeholder="Search"
/>

</div>

<div class="sidebar-links">

<a href="group.html">Group</a>

<a href="chat.html">Bot</a>

<a href="game.html">Velora Game</a>

<a href="styles.html">Outfits</a>

<a href="challenges.html">Weekly Challenges</a>

<a href="store.html">Velora Store</a>

<a href="subscription.html">Subscription</a>

<a href="profile.html">Profile</a>

<a href="private.html">Create Group</a>

</div>

<div class="profile">

<div class="profile-circle">
VW
</div>

<div class="profile-text">
Profile
</div>

</div>

</div>

</div>

<script>

const openMenu = document.getElementById('openMenu');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

openMenu.onclick = () => {

sidebar.classList.add('active');
overlay.classList.add('active');

};

overlay.onclick = () => {

sidebar.classList.remove('active');
overlay.classList.remove('active');

};

</script>

</body>
</html>
