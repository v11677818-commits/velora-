<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velora</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#000;
color:#fff;
height:100vh;
overflow:hidden;
}

/* TOP */

.top-bar{
position:fixed;
top:20px;
right:20px;
display:flex;
align-items:center;
gap:12px;
z-index:1000;
}

.subscribe-btn{
height:54px;
padding:0 30px;
border-radius:999px;
border:1px solid #2a2a2a;
background:#141414;
color:#fff;
font-size:15px;
cursor:pointer;
}

.menu-btn{
width:54px;
height:54px;
border-radius:50%;
border:1px solid #2a2a2a;
background:#141414;
color:#fff;
font-size:26px;
cursor:pointer;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:0;
right:-100%;
width:88%;
max-width:360px;
height:100%;
background:#000;
border-left:1px solid #1c1c1c;
padding:26px;
transition:.35s;
z-index:999;
overflow-y:auto;
}

.sidebar.active{
right:0;
}

.search-box{
width:100%;
height:56px;
border:none;
outline:none;
border-radius:999px;
background:#141414;
color:#fff;
padding:0 20px;
font-size:15px;
margin-bottom:34px;
border:1px solid #222;
}

.menu-links{
display:flex;
flex-direction:column;
gap:26px;
}

.menu-links a{
text-decoration:none;
color:#fff;
font-size:18px;
font-weight:500;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;
background:rgba(255,255,255,.08);
backdrop-filter:blur(2px);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:500;
}

.overlay.active{
opacity:1;
pointer-events:auto;
}

/* CENTER */

.center-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:42px;
font-weight:600;
text-align:center;
}

/* MESSAGES */

.messages{
position:absolute;
top:100px;
left:0;
width:100%;
height:calc(100vh - 190px);
overflow-y:auto;
padding:24px;
display:flex;
flex-direction:column;
gap:18px;
}

.message{
max-width:78%;
padding:16px;
border-radius:22px;
background:#111;
border:1px solid #1f1f1f;
}

.user{
align-self:flex-end;
background:#1a1a1a;
}

.bot{
align-self:flex-start;
}

.msg-name{
font-size:13px;
color:#8d8d8d;
margin-bottom:6px;
}

.msg-text{
font-size:16px;
line-height:1.6;
word-break:break-word;
}

/* BOTTOM */

.bottom-bar{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:920px;
height:70px;
background:#141414;
border:1px solid #242424;
border-radius:999px;
display:flex;
align-items:center;
padding:0 12px;
z-index:1000;
}

.message-input{
flex:1;
height:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:16px;
padding:0 18px;
}

.send-btn{
width:52px;
height:52px;
border-radius:50%;
border:none;
background:#222;
color:#fff;
font-size:24px;
cursor:pointer;
}

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#222;
border-radius:999px;
}

</style>

</head>

<body>

<!-- TOP -->

<div class="top-bar">

<button class="subscribe-btn">
Subscription
</button>

<button class="menu-btn" onclick="openMenu()">
☰
</button>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<input
type="text"
class="search-box"
placeholder="Search">

<div class="menu-links">

<a href="group.html">
Group
</a>

<a href="chat.html">
Bot
</a>

<a href="game.html">
Velora Game
</a>

<a href="styles.html">
Styles
</a>

<a href="challenges.html">
Weekly Challenges
</a>

<a href="store.html">
Velora Store
</a>

<a href="subscription.html">
Subscription
</a>

<a href="profile.html">
Profile
</a>

</div>

</div>

<!-- CENTER -->

<div class="center-text" id="welcomeText">
How can I help you?
</div>

<!-- MESSAGES -->

<div class="messages" id="messages"></div>

<!-- BOTTOM -->

<div class="bottom-bar">

<input
id="messageInput"
class="message-input"
type="text"
placeholder="Message Velora">

<button
class="send-btn"
onclick="sendMessage()">
+
</button>

</div>

<script>

/* MENU */

function openMenu(){

document
.getElementById("sidebar")
.classList
.add("active");

document
.getElementById("overlay")
.classList
.add("active");

}

function closeMenu(){

document
.getElementById("sidebar")
.classList
.remove("active");

document
.getElementById("overlay")
.classList
.remove("active");

}

/* SUPABASE */

const SUPABASE_URL =
"https://lwnheytfhwgryxikjjwu.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bmhleXRmaHdncnl4aWtqand1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MDcxNjEsImV4cCI6MjA5MzI4MzE2MX0.qTJGYWouA9w9RZU8WFkE7ZbK-J3O1Snvwi9CbEMNxtQ";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* SEND */

async function sendMessage(){

try{

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(text === "") return;

document
.getElementById("welcomeText")
.style.display = "none";

const messages =
document.getElementById("messages");

/* USER */

messages.innerHTML += `

<div class="message user">

<div class="msg-name">
You
</div>

<div class="msg-text">
${text}
</div>

</div>

`;

messages.scrollTop =
messages.scrollHeight;

input.value = "";

/* BOT */

setTimeout(()=>{

messages.innerHTML += `

<div class="message bot">

<div class="msg-name">
Velora AI
</div>

<div class="msg-text">
Your message has been received.
</div>

</div>

`;

messages.scrollTop =
messages.scrollHeight;

},700);

/* SAVE */

await supabase
.from("messages")
.insert([
{
name:"You",
message:text
}
]);

}catch(error){

console.log(error);

}

}

</script>

</body>
</html>
