<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Velora Bot</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
overflow:hidden;
}

/* APP */

.app{
width:100%;
height:100vh;
background:#000;
position:relative;
overflow:hidden;
}

/* TOP */

.topbar{
position:absolute;
top:22px;
right:22px;
display:flex;
align-items:center;
gap:14px;
z-index:1000;
}

.subscribe-btn{
height:52px;
padding:0 30px;
border:none;
border-radius:999px;
background:#171717;
color:#fff;
font-size:15px;
cursor:pointer;
}

.menu-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#171717;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.menu-icon{
width:18px;
height:2px;
background:#fff;
position:relative;
}

.menu-icon::before{
content:'';
position:absolute;
top:-6px;
left:0;
width:18px;
height:2px;
background:#fff;
}

.menu-icon::after{
content:'';
position:absolute;
top:6px;
left:0;
width:18px;
height:2px;
background:#fff;
}

/* CENTER */

.center-title{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:#fff;
font-size:42px;
font-weight:600;
white-space:nowrap;
}

/* CHAT */

.chat-container{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:1000px;
background:#151515;
border:1px solid #242424;
border-radius:40px;
padding:12px;
display:flex;
align-items:center;
gap:12px;
}

/* VOICE */

.voice-btn{
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex-shrink:0;
}

.voice-lines{
display:flex;
align-items:flex-end;
gap:2px;
height:16px;
}

.voice-lines span{
width:3px;
background:#000;
border-radius:999px;
}

.voice-lines span:nth-child(1){
height:7px;
}

.voice-lines span:nth-child(2){
height:12px;
}

.voice-lines span:nth-child(3){
height:9px;
}

.voice-lines span:nth-child(4){
height:15px;
}

/* IMAGE */

.image-btn{
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#222;
color:#fff;
font-size:20px;
cursor:pointer;
flex-shrink:0;
}

/* INPUT */

.chat-input{
flex:1;
background:none;
border:none;
outline:none;
color:#fff;
font-size:16px;
padding:0 10px;
}

.chat-input::placeholder{
color:#8a8a8a;
}

/* SEND */

.send-btn{
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#fff;
color:#000;
font-size:18px;
font-weight:600;
cursor:pointer;
flex-shrink:0;
}

/* SIDEBAR */

.overlay{
position:fixed;
inset:0;
background:rgba(255,255,255,.08);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:1500;
}

.overlay.active{
opacity:1;
pointer-events:auto;
}

.sidebar{
position:fixed;
top:0;
right:-420px;
width:420px;
max-width:100%;
height:100vh;
background:#050505;
padding:30px;
transition:.35s;
z-index:2000;
overflow:auto;
}

.sidebar.active{
right:0;
}

.search-box{
width:100%;
height:58px;
background:#171717;
border:1px solid #2a2a2a;
border-radius:40px;
display:flex;
align-items:center;
padding:0 22px;
margin-top:40px;
}

.search-box input{
width:100%;
background:none;
border:none;
outline:none;
color:#fff;
font-size:16px;
}

.search-box input::placeholder{
color:#888;
}

.sidebar-links{
margin-top:50px;
display:flex;
flex-direction:column;
gap:34px;
}

.sidebar-links a{
color:#fff;
font-size:33px;
text-decoration:none;
text-align:right;
}

/* PROFILE */

.profile{
position:absolute;
bottom:30px;
right:30px;
display:flex;
align-items:center;
gap:12px;
}

.profile-circle{
width:45px;
height:45px;
border-radius:50%;
background:#9147ff;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:14px;
}

.profile span{
color:#fff;
font-size:18px;
}

/* MESSAGES */

.messages{
position:absolute;
top:120px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:1000px;
height:65vh;
overflow:auto;
padding-bottom:30px;
}

.message{
background:#111;
border:1px solid #222;
padding:16px 20px;
border-radius:22px;
color:#fff;
margin-bottom:14px;
width:fit-content;
max-width:80%;
font-size:15px;
line-height:1.5;
}

.user{
margin-left:auto;
background:#1b1b1b;
}

/* MOBILE */

@media(max-width:700px){

.center-title{
font-size:28px;
}

.sidebar{
width:100%;
}

.sidebar-links a{
font-size:25px;
}

.chat-container{
padding:10px;
}

}

</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="topbar">

<a href="subscription.html">
<button class="subscribe-btn">
Subscription
</button>
</a>

<button class="menu-btn" id="menuButton">
<div class="menu-icon"></div>
</button>

</div>

<!-- MESSAGES -->

<div class="messages" id="messages"></div>

<!-- CENTER -->

<div class="center-title" id="centerTitle">
How can I help you?
</div>

<!-- CHAT -->

<div class="chat-container">

<button class="voice-btn">

<div class="voice-lines">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</button>

<input type="file" id="imageInput" hidden>

<button class="image-btn" id="imageButton">
+
</button>

<input
type="text"
class="chat-input"
id="chatInput"
placeholder="Ask Velora"
/>

<button class="send-btn" id="sendButton">
↑
</button>

</div>

<!-- SIDEBAR -->

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">

<div class="search-box">
<input type="text" placeholder="Search">
</div>

<div class="sidebar-links">

<a href="group.html">Group</a>

<a href="chat.html">Bot</a>

<a href="game.html">Velora Game</a>

<a href="styles.html">Outfits</a>

<a href="challenges.html">Weekly Challenges</a>

<a href="store.html">Velora Store</a>

<a href="subscription.html">Subscription</a>

<a href="profile.html">Profile</a>

<a href="private.html">Create Group</a>

</div>

<div class="profile">

<div class="profile-circle">
VW
</div>

<span>Profile</span>

</div>

</div>

</div>

<script>

/* SIDEBAR */

const menuButton = document.getElementById('menuButton');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

menuButton.onclick = () => {

sidebar.classList.add('active');
overlay.classList.add('active');

}

overlay.onclick = () => {

sidebar.classList.remove('active');
overlay.classList.remove('active');

}

/* CHAT */

const sendButton = document.getElementById('sendButton');
const chatInput = document.getElementById('chatInput');
const messages = document.getElementById('messages');
const centerTitle = document.getElementById('centerTitle');

let userType = "registered";

/*

guest = 6 messages no images
registered = 21 messages + images
subscriber = unlimited

*/

let messageLimit = 21;
let messageCount = 0;

function addMessage(text,type){

const div = document.createElement('div');

div.classList.add('message');

if(type === 'user'){
div.classList.add('user');
}

div.innerText = text;

messages.appendChild(div);

messages.scrollTop = messages.scrollHeight;

}

function botReply(){

setTimeout(()=>{

addMessage("Velora AI response...",'bot');

},700);

}

function sendMessage(){

const text = chatInput.value.trim();

if(text === '') return;

if(userType === 'guest' && messageCount >= 6){

alert('Guest limit reached');

return;

}

if(userType === 'registered' && messageCount >= 21){

alert('Registered limit reached');

return;

}

centerTitle.style.display = 'none';

addMessage(text,'user');

chatInput.value = '';

messageCount++;

botReply();

}

sendButton.onclick = sendMessage;

chatInput.addEventListener('keydown',(e)=>{

if(e.key === 'Enter'){
sendMessage();
}

});

/* IMAGE */

const imageButton = document.getElementById('imageButton');
const imageInput = document.getElementById('imageInput');

imageButton.onclick = ()=>{

if(userType === 'guest'){

alert('Guests cannot upload images');

return;

}

imageInput.click();

}

imageInput.addEventListener('change',()=>{

if(imageInput.files.length > 0){

centerTitle.style.display = 'none';

addMessage("Image uploaded",'user');

botReply();

}

});

</script>

</body>
</html>
